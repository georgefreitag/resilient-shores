<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{%- if site.gtm_id != "" and site.gtm_id and jekyll.environment == "production" %}
<!-- Google Tag Manager -->
<script async src="https://www.googletagmanager.com/gtm.js?id={{ site.gtm_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
{%- endif %}
{% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
{% seo %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
<link rel="icon" href="{{ '/assets/images/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/images/icons/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<meta name="theme-color" content="#0f5249">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Fira+Sans+Condensed:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if page.url == '/' %}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
  {"@type":"Book","name":"Resilient Shores: Adapting to Climate Change Through Storytelling","author":{"@id":"#bob"},"publisher":{"@type":"Organization","name":"Springer Nature"},"datePublished":"2026","url":"{{ site.springer_url }}"},
  {"@type":"Person","@id":"#bob","name":"Bob Freitag","jobTitle":"Resilience practitioner and educator","alumniOf":"University of Washington"}
]}
</script>
{% endif %}
