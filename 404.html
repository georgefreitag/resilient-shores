---
title: "Page not found"
permalink: /404.html
---
  <section class="wash">
    <div class="wrap prose">
      <h1>We couldn’t find that page.</h1>
      <p>The link may be out of date. Try the home page, or start building your own story.</p>
      <div class="btn-row">
        <a class="btn btn-primary" href="{{ '/' | relative_url }}">Go to the home page</a>
        <a class="btn btn-ghost" href="{{ '/create-a-story/' | relative_url }}">Create a story</a>
      </div>
    </div>
  </section>
<script>
  // GitHub Pages serves this one 404 page for the whole site, including /staging/.
  // When the missing page was under /staging/, keep the visitor on staging.
  (function () {
    var base = '/staging';
    if (location.pathname.indexOf(base + '/') !== 0) return;
    document.querySelectorAll('a[href^="/"]').forEach(function (a) {
      var h = a.getAttribute('href');
      if (h.indexOf(base + '/') !== 0) a.setAttribute('href', base + h);
    });
  })();
</script>
